<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | El rincón del libro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Lora:ital,wght@0,400;0,500;0,700;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="pag-registro">
  <header class="cabecera">
    <a class="marca" href="index.html">El rincón del libro</a>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="registro.html">Registro</a></li>
        <li><a href="quienes-somos.html">Quiénes somos</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="carrito.html">Carrito (<span id="contador">0</span>)</a></li>
        <li><a href="busqueda.html">Búsqueda</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Hazte lector</h1>
    <form id="form-registro" class="formulario" novalidate>
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" autocomplete="name">

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" autocomplete="email"
             pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}"
             title="Escribe un correo válido, por ejemplo: nombre@dominio.com">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="new-password">

      <label for="nacimiento">Fecha de nacimiento</label>
      <input type="date" id="nacimiento" name="nacimiento">

      <label for="telefono">Teléfono (10 dígitos)</label>
      <input type="tel" id="telefono" name="telefono" inputmode="numeric"
             pattern="[0-9]{10}" title="Escribe 10 dígitos, sin espacios">

      <label class="check">
        <input type="checkbox" id="terminos" name="terminos">
        Acepto los términos y condiciones
      </label>

      <button type="submit" id="btn-registro" class="boton" disabled>Crear cuenta</button>
      <p id="mensaje-registro" class="mensaje" role="status"></p>
    </form>
  </main>
  <footer class="pie">
    <p>Proyecto escolar de demostración. Consulta la <a href="https://developer.mozilla.org/es/docs/Learn/Common_questions/Web_mechanics/What_is_a_URL" target="_blank" rel="noopener">guía de URLs en MDN</a>.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
